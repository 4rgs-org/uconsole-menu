version: 2

project_name: uconsole-menu

before:
  hooks:
    - go mod tidy

builds:
  - id: linux-arm64
    main: .
    binary: uconsole-menu
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
      - PKG_CONFIG=/usr/bin/aarch64-linux-gnu-pkg-config
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    tags:
      - gtk_3_24

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

checksum:
  name_template: 'SHA256SUMS'
  algorithm: sha256

release:
  github:
    owner: 4rgs-org
    name: uconsole-menu
  draft: false
  prerelease: auto
  header: |
    ## uconsole-menu {{ .Tag }}
  footer: |
    ## Install

    ```sh
    curl -sSL https://raw.githubusercontent.com/4rgs-org/uconsole-menu/main/install.sh | sh
    ```
