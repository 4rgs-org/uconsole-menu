name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Enable arm64 apt sources
        run: |
          sudo dpkg --add-architecture arm64
          # Elimina la fuente de security: no expone arm64 y rompe el update.
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*arm64*
          sudo rm -f /etc/apt/sources.list.d/*ports*
          # Reescribe sources.list para que archive sirva para ambos arches.
          sudo bash -c 'cat > /etc/apt/sources.list <<EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=arm64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          EOF'

      - name: Install ARM64 cross toolchain and GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            pkg-config \
            crossbuild-essential-arm64
          sudo apt-get install -y \
            libgtk-3-dev:arm64 \
            libcairo2-dev:arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
