name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a crear y publicar (ej: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Enable arm64 apt sources via ports.ubuntu.com
        run: |
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*arm64*
          sudo bash -c 'cat > /etc/apt/sources.list <<EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          EOF'

      - name: Install ARM64 cross toolchain and GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            pkg-config \
            crossbuild-essential-arm64
          # Habilita qemu para que los hooks de post-install arm64 corran en el runner amd64.
          sudo apt-get install -y qemu-user-static
          sudo update-binfmts --enable qemu-aarch64
          sudo apt-get install -y \
            libgtk-3-dev:arm64 \
            libcairo2-dev:arm64

      - name: Pre-fetch and patch gotk3
        # El bug upstream hace que gotk3 v0.6.4 no compile; parchear antes
        # de la primera llamada de go mod tidy desde goreleaser.
        run: |
          chmod +x ./patch-callback.sh
          sudo HOME=/root go mod download -x
          sudo HOME=/root ./patch-callback.sh

      - name: Bootstrap go.sum
        # Genera go.sum con los hashes de los módulos descargados, necesario
        # para que goreleaser no falle al cargar el módulo cache. Se commitea
        # antes de correr goreleaser para que el push no se queje de dirty.
        run: |
          sudo HOME=/root go mod tidy
          sudo HOME=/root cp -f go.sum go.sum.new
          sudo chown $(id -u):$(id -g) go.sum.new
          mv go.sum.new go.sum
          git add go.sum || true
          git config user.name "4rgs-bot"
          git config user.email "alvaro.gonzalez.dev@gmail.com"
          git commit -m "Update go.sum after gotk3 patch" || true

      - name: Create tag
        run: |
          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
